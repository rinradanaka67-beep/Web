<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ฝากไฟล์ · แอดมิน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#17171b;--field:#222228;--text:#f1ecf7;--muted:#9a8fab;--accent:#f7a8cf;--err:#fb7185;--ok:#6ee7b7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Kanit,"Noto Sans Thai",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0}h1 span{color:var(--accent)}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:16px}
button{font:inherit;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:var(--field);color:var(--text)}
button.p{background:var(--accent);color:#2a0f1d;font-weight:500}button.d{color:var(--err)}button:hover{filter:brightness(1.15)}
input[type=text]{font:inherit;border:0;border-radius:12px;background:var(--field);color:var(--text);padding:10px 12px;width:100%}
.slug{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted)}.slug b{white-space:nowrap;font-weight:400}
#drop{border:2px dashed #3a3a44;border-radius:16px;padding:28px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
#drop.over{border-color:var(--accent);color:var(--accent);background:rgba(247,168,207,.06)}
.up{margin-top:12px}.up .n{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--field);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.row{padding:14px 0;border-top:1px solid #26262d}.row:first-child{border-top:0}
.name{font-weight:500;word-break:break-all}.meta{font-size:12px;color:var(--muted);margin:2px 0 8px}
.link{display:flex;gap:8px;margin-bottom:8px}.link input{font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2a32;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}.toast.on{opacity:1}
</style></head><body><div class="wrap">
<header><h1>ฝากไฟล์ <span>· แอดมิน</span></h1><button id="out">ออกจากระบบ</button></header>
<div class="card">
  <div class="slug"><b id="base">…/</b><input type="text" id="slug" placeholder="ชื่อลิงก์ของคุณ เช่น api/update (เว้นว่าง = ให้ระบบสุ่มให้)" autocomplete="off"></div>
  <div id="drop">ลากไฟล์มาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์<input type="file" id="pick" multiple hidden></div><div id="ups"></div>
</div>
<div class="card"><div id="list"><div class="empty">กำลังโหลด…</div></div></div>
<input type="file" id="repPick" hidden>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login';throw 0}return r}
async function load(){
  const d=await (await api('/api/files')).json();
  $('#base').textContent=d.base.replace(/^https?:\/\//,'')+'/';
  $('#list').innerHTML=d.files.length?d.files.map(f=>`<div class="row"><div class="name">${esc(f.name)}</div>
  <div class="meta">${size(f.size)} · อัปเดตล่าสุด ${new Date(f.time).toLocaleString('th-TH')}</div>
  <div class="link"><input type="text" readonly value="${esc(f.link)}" onclick="this.select()"></div>
  <div class="acts"><button data-copy="${esc(f.link)}">คัดลอกลิงก์</button><button class="p" data-rep="${f.id}">อัปเดตไฟล์</button>
  <button data-slug="${f.id}" data-cur="${esc(f.slug||'')}">แก้ชื่อลิงก์</button><button class="d" data-del="${f.id}">ลบ</button></div></div>`).join(''):'<div class="empty">ยังไม่มีไฟล์</div>';
}
function send(url,file,label){
  const box=document.createElement('div');box.className='up';
  box.innerHTML=`<div class="n"><span>${esc(label)}</span><span class="st">0%</span></div><div class="bar"><i></i></div>`;$('#ups').prepend(box);
  const st=box.querySelector('.st'),x=new XMLHttpRequest();x.open('POST',url);
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);st.textContent=p+'%';box.querySelector('i').style.width=p+'%'}};
  x.onload=()=>{if(x.status===401)return location.href='/login';let d={};try{d=JSON.parse(x.responseText)}catch{}
    if(x.status===200){st.textContent='สำเร็จ';st.style.color='var(--ok)';load()}else{st.textContent=d.error||'ไม่สำเร็จ';st.style.color='var(--err)'}};
  x.onerror=()=>{st.textContent='เชื่อมต่อไม่ได้';st.style.color='var(--err)'};
  x.send(file);
}
function uploadNew(file){
  const slug=$('#slug').value.trim();
  send('/api/upload?name='+encodeURIComponent(file.name)+'&slug='+encodeURIComponent(slug),file,file.name);
  $('#slug').value='';
}
let repId=null;
$('#repPick').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f&&repId)send('/api/files/'+repId+'/replace?name='+encodeURIComponent(f.name),f,'อัปเดต: '+f.name)};
$('#list').addEventListener('click',async e=>{
  const t=e.target.dataset;
  if(t.copy){try{await navigator.clipboard.writeText(t.copy);toast('คัดลอกลิงก์แล้ว')}catch{prompt('คัดลอกลิงก์:',t.copy)}}
  if(t.rep){repId=t.rep;$('#repPick').click()}
  if(t.slug){const v=prompt('ชื่อลิงก์ใหม่ (เช่น api/update) เว้นว่าง = ให้ระบบสุ่ม',t.cur);if(v===null)return;
    const r=await api('/api/files/'+t.slug,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:v})});
    const d=await r.json();if(r.ok){toast('เปลี่ยนลิงก์แล้ว');load()}else toast(d.error||'ไม่สำเร็จ')}
  if(t.del&&confirm('ลบไฟล์นี้ถาวร? ลิงก์จะใช้ไม่ได้อีก')){await api('/api/files/'+t.del,{method:'DELETE'});toast('ลบแล้ว');load()}
});
const drop=$('#drop'),pick=$('#pick');
drop.onclick=()=>pick.click();pick.onchange=()=>{[...pick.files].forEach(uploadNew);pick.value=''};
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>[...e.dataTransfer.files].forEach(uploadNew));
$('#out').onclick=()=>fetch('/api/admin/logout',{method:'POST'}).then(()=>location.href='/login');
load();
</script></body></html>
